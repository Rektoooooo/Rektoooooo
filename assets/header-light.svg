<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 0 1016 380" width="1016" height="380" role="img" aria-label="Sebastian Kucera, iOS developer in Prague">
  <style>
    .blob { transform-box: fill-box; transform-origin: center; }
    @keyframes drift-a { from { transform: translate(0,0) scale(1); } to { transform: translate(90px,40px) scale(1.15); } }
    @keyframes drift-b { from { transform: translate(0,0) scale(1.1); } to { transform: translate(-80px,50px) scale(0.95); } }
    @keyframes drift-c { from { transform: translate(0,0) scale(1); } to { transform: translate(-60px,-70px) scale(1.12); } }
    @keyframes notif { from { opacity: 0; transform: translateY(18px) scale(0.97); } to { opacity: 1; transform: none; } }
    .notif { transform-box: fill-box; transform-origin: center; animation: notif 0.8s cubic-bezier(.2,.9,.3,1.2) 0.15s both; }
    @media (prefers-reduced-motion: reduce) { .blob, .notif { animation: none !important; } }
    text { font-family: -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .name { font-family: ui-rounded, 'SF Pro Rounded', -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    /* On phones the banner renders ~360px wide: drop the tiny status bar and enlarge the small text. */
    .compact { display: none; }
    @media (max-width: 560px) { .full { display: none; } .compact { display: inline; } }
  </style>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef0ff"/><stop offset="1" stop-color="#fdf0f7"/></linearGradient>
    <radialGradient id="b0"><stop offset="0" stop-color="#6d5dfc" stop-opacity="0.55"/><stop offset="1" stop-color="#6d5dfc" stop-opacity="0"/></radialGradient><radialGradient id="b1"><stop offset="0" stop-color="#ff4f9a" stop-opacity="0.55"/><stop offset="1" stop-color="#ff4f9a" stop-opacity="0"/></radialGradient><radialGradient id="b2"><stop offset="0" stop-color="#22b5ff" stop-opacity="0.55"/><stop offset="1" stop-color="#22b5ff" stop-opacity="0"/></radialGradient><radialGradient id="b3"><stop offset="0" stop-color="#ff9a3c" stop-opacity="0.55"/><stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/></radialGradient>
    <clipPath id="frame"><rect width="1000" height="380" rx="28"/></clipPath>
    <clipPath id="avatar"><circle cx="246.0" cy="280.0" r="26"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1000" height="380" fill="url(#base)"/>
    <circle class="blob" style="animation:drift-a 19s ease-in-out infinite alternate" cx="180" cy="60" r="360" fill="url(#b0)"/><circle class="blob" style="animation:drift-b 23s ease-in-out infinite alternate" cx="860" cy="40" r="330" fill="url(#b1)"/><circle class="blob" style="animation:drift-c 21s ease-in-out infinite alternate" cx="680" cy="400" r="380" fill="url(#b2)"/><circle class="blob" style="animation:drift-b 26s ease-in-out infinite alternate" cx="60" cy="400" r="300" fill="url(#b3)"/>

    <!-- status bar -->
    <g class="full">
    <text x="40" y="44" font-size="16" font-weight="600" fill="#14141f">Rektoooooo</text>
    <g fill="#14141f" transform="translate(888 31)">
      <rect x="0" y="9" width="3.5" height="5" rx="1"/><rect x="5.5" y="6" width="3.5" height="8" rx="1"/>
      <rect x="11" y="3" width="3.5" height="11" rx="1"/><rect x="16.5" y="0" width="3.5" height="14" rx="1"/>
      <path d="M38 13.5 l-3.2-3.4 a4.6 4.6 0 0 1 6.4 0z M30.6 6.2 a10.6 10.6 0 0 1 14.8 0 l-2 2.1 a7.6 7.6 0 0 0 -10.8 0z" />
      <rect x="54" y="1" width="24" height="12" rx="3.5" fill="none" stroke="#14141f" stroke-opacity="0.45"/>
      <rect x="56" y="3" width="18" height="8" rx="1.8"/><rect x="79.5" y="5" width="1.8" height="4" rx="0.9" fill-opacity="0.45"/>
    </g>
    </g>

    <!-- lock -->
    <g transform="translate(491.0 62)" fill="none" stroke="#14141f" stroke-width="2.4">
      <path d="M4 10 V6.5 a5 5 0 0 1 10 0 V10"/>
      <rect x="0.5" y="10" width="17" height="13" rx="3" fill="#14141f" stroke="none"/>
    </g>

    <text class="full" x="500.0" y="122" text-anchor="middle" font-size="22" font-weight="600" fill="rgba(20,20,31,0.72)">iOS developer · Prague</text>
    <text class="compact" x="500.0" y="124" text-anchor="middle" font-size="34" font-weight="600" fill="rgba(20,20,31,0.72)">iOS developer · Prague</text>
    <text class="name" x="500.0" y="206" text-anchor="middle" font-size="84" font-weight="700" letter-spacing="-1" fill="#14141f">Sebastian Kucera</text>

    <!-- notification -->
    <g class="notif">
      <rect x="200.0" y="238" width="600" height="84" rx="24" fill="rgba(255,255,255,0.62)" stroke="rgba(255,255,255,0.95)"/>
      <image href="data:image/jpeg;base64," x="220.0" y="254.0" width="52" height="52" clip-path="url(#avatar)" preserveAspectRatio="xMidYMid slice"/>
      <g class="full">
        <text x="288.0" y="273" font-size="18" font-weight="700" fill="#1d1d1f">Seb</text>
        <text x="778.0" y="273" text-anchor="end" font-size="15" fill="rgba(29,29,31,0.55)">now</text>
        <text x="288.0" y="299" font-size="17" fill="#1d1d1f">I build iOS apps with SwiftUI and tools for the Mac.</text>
      </g>
      <g class="compact">
        <text x="288.0" y="274" font-size="26" font-weight="700" fill="#1d1d1f">Seb</text>
        <text x="778.0" y="274" text-anchor="end" font-size="22" fill="rgba(29,29,31,0.55)">now</text>
        <text x="288.0" y="306" font-size="26" fill="#1d1d1f">I build iOS apps and Mac tools.</text>
      </g>
    </g>

    <rect x="430.0" y="358" width="140" height="5" rx="2.5" fill="#14141f" fill-opacity="0.4"/>
  </g>
</svg>
