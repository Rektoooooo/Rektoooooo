  <rect x="118" y="76" width="77" height="26" rx="13" fill="rgba(240,246,252,0.06)" stroke="rgba(240,246,252,0.12)"/><text x="156.7" y="93.5" text-anchor="middle" font-size="13" font-weight="600" fill="#9198a1">macOS</text><rect x="203.36" y="76" width="92" height="26" rx="13" fill="rgba(240,246,252,0.06)" stroke="rgba(240,246,252,0.12)"/><text x="249.6" y="93.5" text-anchor="middle" font-size="13" font-weight="600" fill="#9198a1">Menu bar</text>
  <path d="M439 32 h13 v13 M452 32 l-15 15" fill="none" stroke="#9198a1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
